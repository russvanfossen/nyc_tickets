[project]
name = "nyc-tickets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sodapy>=2.2.0",
    "streamlit>=1.67.0",
]

[project.scripts]
nyc-tickets = "nyc_tickets:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
